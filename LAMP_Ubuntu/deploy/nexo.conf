<VirtualHost *:80>
    ServerName nexo.local
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/nexo/public

    <Directory /var/www/nexo/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # La carpeta app/ (config, código PHP, sesiones) queda FUERA del DocumentRoot.
    ErrorLog ${APACHE_LOG_DIR}/nexo_error.log
    CustomLog ${APACHE_LOG_DIR}/nexo_access.log combined
</VirtualHost>
